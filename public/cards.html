<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYPERSCALE Cards</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <style>
    :root { --bg: #0b1020; --text: #e6ecff; --muted: #93a0c8; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px 60px; }
    header { max-width: 1100px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 12px; }
    h1 { margin: 0; font-size: 34px; letter-spacing: .1em; background: linear-gradient(90deg, #22d3ee, #a78bfa 50%, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
    a, button { color: #22d3ee; } button { background: #1e2a55; border: 1px solid #2c3a6e; border-radius: 8px; padding: 8px 14px; cursor: pointer; font: inherit; }
    @media print {
      body { background: #fff; padding: 0; } header .no-print, h2 + .note { display: none; }
      h1 { color: #000; background: none; } h2 { color: #000; margin: 8mm 0 3mm; }
      .grid { gap: 3mm; } .card { box-shadow: none; }
      .card, .tile { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header>
    <div><h1>HYPERSCALE</h1><div style="color:var(--muted)">Every card in the game, at poker size (63 × 88 mm). Print, cut, sleeve.</div></div>
    <div class="no-print"><a href="./">Play online</a> · <a href="rules.html">Rules</a> · <button onclick="print()">Print</button></div>
  </header>
  <main id="root" class="gallery"></main>
  <script type="module">
    import { cardsHTML, CARD_CSS } from './cardgallery.js';
    document.head.insertAdjacentHTML('beforeend', `<style>${CARD_CSS}</style>`);
    document.getElementById('root').innerHTML = cardsHTML();
  </script>
</body>
</html>
