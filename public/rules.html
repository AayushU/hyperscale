<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYPERSCALE Rules</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <style>
    body { margin: 0; background: #0b1020; color: #e6ecff; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px 80px; }
    main { max-width: 820px; margin: 0 auto; }
    nav { max-width: 820px; margin: 0 auto 10px; color: #93a0c8; }
    a { color: #22d3ee; }
    h1 { font-size: 34px; background: linear-gradient(90deg, #22d3ee, #a78bfa 50%, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h2 { margin-top: 36px; border-bottom: 1px solid #2c3a6e; padding-bottom: 4px; }
    h3 { color: #c4b5fd; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
    th, td { border: 1px solid #2c3a6e; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #172042; }
    code { background: #172042; padding: 1px 5px; border-radius: 4px; }
    hr { border: 0; border-top: 1px solid #2c3a6e; margin: 28px 0; }
    blockquote { border-left: 3px solid #a78bfa; margin: 0; padding-left: 12px; color: #c7d0f0; }
  </style>
</head>
<body>
  <nav><a href="./">Play online</a> · <a href="cards.html">All the cards</a></nav>
  <main id="root">Loading rules…</main>
  <script type="module">
    import { renderMarkdown } from './md.js';
    fetch('RULES.md').then(r => r.text()).then(md => {
      document.getElementById('root').innerHTML = renderMarkdown(md);
      if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    });
  </script>
</body>
</html>
